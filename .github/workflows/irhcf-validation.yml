name: IRHCF Architecture Validation

on:
  push:
    branches: ["main", "irhcf-final-architecture-2026-10-08"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript architecture
        run: npm test

  live-health:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Wait for the Render deployment and verify its health endpoint
        shell: bash
        run: |
          health_url="https://nkwasibwe-irhcf.onrender.com/api/health"
          for attempt in $(seq 1 18); do
            echo "Render health check attempt ${attempt}/18"
            if curl --silent --show-error --fail --max-time 15 "$health_url" --output /tmp/irhcf-health.json; then
              cat /tmp/irhcf-health.json
              if node -e 'const h = JSON.parse(require("fs").readFileSync("/tmp/irhcf-health.json", "utf8")); if (!h.success) process.exit(1);'; then
                echo "Render backend health endpoint returned success."
                exit 0
              fi
              echo "Health endpoint responded, but the payload reported an unhealthy service."
            fi
            sleep 10
          done
          echo "Render backend did not become healthy within the retry window."
          exit 1
