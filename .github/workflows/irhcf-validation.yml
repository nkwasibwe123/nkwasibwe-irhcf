name: IRHCF Architecture Validation

on:
  push:
    branches: ["main", "irhcf-final-architecture-2026-10-08"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript architecture
        run: npm test

  live-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Checkout runtime history for deployment verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the Render deployment and verify its health endpoint
        shell: bash
        run: |
          health_url="https://nkwasibwe-irhcf.onrender.com/api/health"
          # Resolve the latest runtime-changing commit in history even if a newer
          # docs/tests/workflow commit superseded it while Render was deploying.
          expected_commit="$(node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const commits = execFileSync("git", ["log", "--first-parent", "--format=%H", process.env.GITHUB_SHA], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
          const isNonRuntime = file =>
            file.startsWith(".github/workflows/") ||
            /(^|\/)(test|tests|__tests__)\//.test(file) ||
            /(^|\/)[^/]+\.test\.[^/]+$/.test(file) ||
            file.endsWith(".md");
          for (const sha of commits) {
            const files = execFileSync("git", ["diff-tree", "--root", "--no-commit-id", "--name-only", "-r", sha], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
            if (files.some(file => !isNonRuntime(file))) {
              process.stdout.write(sha);
              process.exit(0);
            }
          }
          process.stdout.write("");
          NODE
          )"
          if [[ -z "$expected_commit" ]]; then
            echo "Could not determine the latest runtime-changing commit; refusing to pass deployment verification."
            exit 1
          fi
          echo "Expected latest runtime commit: $expected_commit"
          export IRHCF_EXPECTED_DEPLOY_COMMIT="$expected_commit"
          for attempt in $(seq 1 36); do
            current_main_sha="$(curl --silent --fail --max-time 10 "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).sha||"")}catch{}})' || true)"
            if [[ -n "$current_main_sha" && "$current_main_sha" != "$GITHUB_SHA" ]]; then
              echo "This run was superseded by newer main commit $current_main_sha; the newer run owns deployment verification."
              exit 0
            fi
            echo "Render health check attempt ${attempt}/36"
            if curl --silent --show-error --fail --max-time 15 "$health_url" --output /tmp/irhcf-health.json; then
              cat /tmp/irhcf-health.json
              if node -e 'const h = JSON.parse(require("fs").readFileSync("/tmp/irhcf-health.json", "utf8")); const expected = process.env.IRHCF_EXPECTED_DEPLOY_COMMIT; const baseHealthy = h.success === true && h.system?.status === "healthy" && h.system?.ready === true && h.components?.database?.status === "healthy" && h.components?.authentication?.status === "healthy"; const detailedReady = !expected || (h.mediaProviders && typeof h.mediaProviders.videoGeneration === "boolean" && h.researchProviders && typeof h.researchProviders.googleSearchGrounding === "boolean" && h.integrationProviders && h.mediaProviderConfiguration?.localImageService && typeof h.mediaProviderConfiguration.localImageService.urlConfigured === "boolean" && typeof h.mediaProviderConfiguration.localImageService.tokenConfigured === "boolean" && h.mediaProviderConfiguration.localImageService.enabled === true && typeof h.integrationProviders.googleOAuth === "boolean" && typeof h.integrationProviders.credentialEncryption === "boolean" && h.selfImprovement?.enabled === true && h.selfImprovement?.automaticFailureScanning === true && h.selfImprovement?.worker?.running === true); if (!baseHealthy || !detailedReady || (expected && h.deployment?.commit !== expected)) { console.log("Render has not deployed the expected runtime commit or is unhealthy. Expected " + (expected || "any healthy existing runtime for a tests/docs/workflow-only change") + "; serving " + (h.deployment && h.deployment.commit || "unknown") + "."); process.exit(1); } for (const [name, ready] of Object.entries(h.mediaProviders)) if (!ready) console.log("::warning::Media provider " + name + " is not configured."); if (h.integrationProviders) for (const [name, ready] of Object.entries(h.integrationProviders)) if (!ready) console.log("::warning::Integration provider " + name + " is not configured.");'; then
                base_url="https://nkwasibwe-irhcf.onrender.com"
                route_code=$(curl --silent --show-error --max-time 15 -o /tmp/irhcf-task-route.json -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' "$base_url/api/tasks")
                echo "POST /api/tasks deployment readiness -> HTTP $route_code"
                if [[ "$route_code" == "401" || "$route_code" == "403" ]]; then
                  echo "Render health endpoint and task manager route are ready."
                  exit 0
                fi
                echo "Render is healthy but /api/tasks is not ready yet; waiting for the deployment."
              else
                echo "Health endpoint responded, but the payload reported an unhealthy service."
              fi
            fi
            sleep 10
          done
          echo "Render backend did not become healthy within the six-minute retry window."
          exit 1

      - name: Smoke-test protected API route registration
        shell: bash
        run: |
          base_url="https://nkwasibwe-irhcf.onrender.com"
          for route in \
            "/api/media/image" \
            "/api/media/image/edit" \
            "/api/media/video" \
            "/api/media/video/status" \
            "/api/media/video/edit" \
            "/api/media/video/photo-animation" \
            "/api/chat" \
            "/api/media/music" \
            "/api/media/speech" \
            "/api/media/transcribe" \
            "/api/capabilities/expansion-plan" \
            "/api/agent/task" \
            "/api/tasks" \
            "/api/tasks/1/activity" \
            "/api/self-improvement/status" \
            "/api/conversations/test-session/messages/1/prepare-edit" \
            "/api/media/video/video_test" \
            "/api/media/video/video_test/content"; do
            if [[ "$route" == "/api/media/video/video_test"* || "$route" == "/api/conversations/"* || "$route" == "/api/self-improvement/status" || "$route" == "/api/media/video/status" || "$route" == "/api/tasks/1/activity" ]]; then
              method="GET"
              [[ "$route" == *"/prepare-edit" ]] && method="POST"
              code=$(curl --silent --show-error --max-time 15 -o /tmp/irhcf-smoke.json -w "%{http_code}" -X "$method" -H "Content-Type: application/json" -d '{}' "$base_url$route")
            else
              method="POST"
              code=$(curl --silent --show-error --max-time 15 -o /tmp/irhcf-smoke.json -w "%{http_code}" -X "$method" -H "Content-Type: application/json" -d '{}' "$base_url$route")
            fi
            echo "$method $route -> HTTP $code"
            if [[ "$code" != "401" && "$code" != "403" ]]; then
              cat /tmp/irhcf-smoke.json
              echo "Expected an authentication rejection for a protected route."
              exit 1
            fi
          done

      - name: Smoke-test marketplace checkout CORS headers
        shell: bash
        run: |
          base_url="https://nkwasibwe-irhcf.onrender.com"
          storefront_origin="https://nkwasibwe-irhcf-web.onrender.com"
          for attempt in $(seq 1 18); do
            echo "Marketplace CORS preflight attempt ${attempt}/18"
            status=$(curl --silent --show-error --max-time 10 -D /tmp/irhcf-cors-headers.txt -o /tmp/irhcf-cors-body.txt -w "%{http_code}" -X OPTIONS "$base_url/api/commerce/checkout" -H "Origin: $storefront_origin" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type,idempotency-key" || true)
            echo "OPTIONS /api/commerce/checkout -> HTTP ${status:-no-response}"
            if [[ ( "$status" == "204" || "$status" == "200" ) ]] && grep -Eiq '^access-control-allow-origin: *https://nkwasibwe-irhcf-web\.onrender\.com' /tmp/irhcf-cors-headers.txt && grep -Eiq '^access-control-allow-headers:.*idempotency-key' /tmp/irhcf-cors-headers.txt; then
              cat /tmp/irhcf-cors-headers.txt
              echo "Marketplace storefront origin and Idempotency-Key CORS header are allowed."
              exit 0
            fi
            echo "CORS headers are not ready yet; waiting for the backend rollout."
            sleep 10
          done
          cat /tmp/irhcf-cors-headers.txt || true
          echo "Marketplace checkout CORS preflight did not become ready within the retry window."
          exit 1

      - name: Verify self-hosted image service readiness
        shell: bash
        run: |
          health_url="https://nkwasibwe-irhcf-image-service.onrender.com/health"
          for attempt in $(seq 1 12); do
            echo "Local image service health check attempt ${attempt}/12"
            if curl --silent --show-error --fail --max-time 20 "$health_url" --output /tmp/irhcf-image-health.json; then
              cat /tmp/irhcf-image-health.json
              if node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/irhcf-image-health.json","utf8")); if (h.success !== true || h.service !== "irhcf-local-image" || h.ready !== true || !Array.isArray(h.capabilities) || !h.capabilities.includes("background-replacement-solid-color")) process.exit(1);'; then
                echo "Self-hosted image service is healthy and advertises the expected background-edit capability."
                exit 0
              fi
              echo "Image service responded but its health contract is incomplete."
            fi
            sleep 10
          done
          echo "Self-hosted image service did not become ready within the retry window."
          exit 1

