name: IRHCF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Generate backend lockfile and report dependency audit
        shell: bash
        run: |
          (cd backend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd backend && npm audit --json) > /tmp/irhcf-backend-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync("/tmp/irhcf-backend-audit.json", "utf8"));
          } catch {
            console.log("Backend dependency audit did not return parseable JSON.");
            process.exit(0);
          }
          if (report.error) console.log("AUDIT_ERROR", JSON.stringify(report.error));
          console.log("Backend dependency audit totals:", JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = (item.via || []).map(entry => typeof entry === "string" ? entry : {
              name: entry.name,
              title: entry.title,
              range: entry.range,
              url: entry.url
            });
            console.log("AUDIT_FINDING", JSON.stringify({
              name,
              severity: item.severity,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via
            }));
          }
          NODE
      - name: Upload generated backend lockfile
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: irhcf-backend-package-lock
          path: backend/package-lock.json
          if-no-files-found: error
      - name: Run syntax checks and automated tests
        run: npm test
