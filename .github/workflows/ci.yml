name: IRHCF CI

on:
  push:
    branches: [main, 'feat/irhcf-self-hosted-image-service', 'fix/image-rembg-return-type-502']
  pull_request:
    branches: [main, 'feat/irhcf-self-hosted-image-service']

permissions:
  contents: read

jobs:
  test:
    name: Node.js checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run syntax checks and automated tests
        run: npm test

  image-service-tests:
    name: Image service regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install fastapi==0.115.12 Pillow==11.1.0
      - name: Run image service regression tests
        working-directory: image-service
        run: python -m unittest -v test_image_service.py
