name: IRHCF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Validate backend lockfile and report dependency audit
        shell: bash
        run: |
          (cd backend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          git diff --exit-code -- backend/package-lock.json
          (cd backend && npm audit --json) > /tmp/irhcf-backend-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync("/tmp/irhcf-backend-audit.json", "utf8"));
          } catch {
            console.log("Backend dependency audit did not return parseable JSON.");
            process.exit(0);
          }
          if (report.error) console.log("AUDIT_ERROR", JSON.stringify(report.error));
          const totals = report.metadata?.vulnerabilities || {};
          console.log("Backend dependency audit totals:", JSON.stringify(totals));
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "## Backend dependency audit\\n\\nTotals: `" + JSON.stringify(totals) + "`\\n\\n");
          }
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = (item.via || []).map(entry => typeof entry === "string" ? entry : {
              name: entry.name,
              title: entry.title,
              range: entry.range,
              url: entry.url
            });
            const finding = { name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable, via };
            console.log("AUDIT_FINDING", JSON.stringify(finding));
            const annotationMessage = (name + " (" + item.severity + ") range " + item.range +
              "; fixAvailable=" + JSON.stringify(item.fixAvailable)).replace(/%/g, "%25").replace(/\\r/g, "%0D").replace(/\\n/g, "%0A");
            console.log("::warning title=Backend dependency vulnerability::" + annotationMessage);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                "- **" + name + "** (" + item.severity + "); range `" + item.range +
                "`; fix available: `" + JSON.stringify(item.fixAvailable) + "`\\n");
            }
          }
          NODE
      - name: Run syntax checks and automated tests
        run: npm test
