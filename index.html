<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nkwasibwe IRHCF</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">N</div>

      <div>
        <h1>Nkwasibwe IRHCF</h1>
        <p>AI Agent</p>
      </div>
    </header>

    <main class="chat">

      <div class="welcome">
        <h2>Murakaza neza 👋</h2>

        <p>
          Ndi <strong>Nkwasibwe IRHCF</strong>.
          Mbwira icyo ushaka gukora.
        </p>
      </div>

      <div id="messages" class="messages">
      </div>

    </main>

    <div class="input-area">

      <input
        id="userInput"
        type="text"
        placeholder="Andika icyo ushaka gukora..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
